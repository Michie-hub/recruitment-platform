# Nginx reverse proxy for the recruitment platform.
#
# Responsibilities split deliberately between here and the app itself:
# - TLS termination, connection-level concerns, and a coarse edge rate
#   limit live HERE — this is the layer that should absorb abusive
#   traffic before it even reaches uvicorn/FastAPI.
# - Fine-grained per-route rate limiting (5/min login, 10/min register)
#   and the full security-headers set already live in the APPLICATION
#   (slowapi + SecurityHeadersMiddleware, built during Milestone 4
#   hardening) — this file does NOT duplicate those headers, since
#   nginx would just be re-adding headers the app already sets, and any
#   drift between the two becomes a confusing place to debug later.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Edge-level rate limit zone: a coarse, IP-based limit across ALL
    # routes, distinct from and in addition to the app's own per-route
    # slowapi limits. This exists to absorb high-volume abuse (e.g. a
    # scraper hammering /api/v1/jobs) before it ever reaches uvicorn —
    # the app-level limits handle the security-sensitive routes
    # specifically (login/register brute-force protection).
    limit_req_zone $binary_remote_addr zone=edge_limit:10m rate=30r/s;

    # Resume uploads are capped at 5MB by the application
    # (MAX_RESUME_SIZE_BYTES in candidate_profile_service.py) — this
    # must be set at least that high or nginx will reject the upload
    # with a 413 before the app's own size-validation logic ever runs,
    # producing a confusing "worked in one test, fails in prod" gap.
    client_max_body_size 6M;

    upstream app_backend {
        # 'app' resolves via Docker's internal DNS to the app service
        # in docker-compose.prod.yml — this only works because both
        # containers are on the same Docker network.
        server app:8000;
    }

    # ---- HTTP: redirect everything to HTTPS ----
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- HTTPS: actual reverse proxy ----
    server {
        listen 443 ssl;
        server_name _;

        # Placeholder cert paths — see DEPLOYMENT.md for how to obtain
        # real certificates (ACM if using an AWS load balancer instead
        # of this nginx container directly, or Let's Encrypt via
        # certbot if nginx itself terminates TLS).
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        limit_req zone=edge_limit burst=20 nodelay;

        location /health {
            # Health checks bypass rate limiting entirely — an
            # orchestrator (ECS, a load balancer) polling this
            # frequently should never be able to trip a rate limit
            # meant for public traffic.
            proxy_pass http://app_backend;
            access_log off;
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;

            # Forwarded headers so the app sees the REAL client IP and
            # protocol, not nginx's — this matters specifically because
            # slowapi's rate limiter keys on request.client.host, which
            # without these headers would see every request as coming
            # from nginx itself, collapsing every distinct user into a
            # single shared rate-limit bucket.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}

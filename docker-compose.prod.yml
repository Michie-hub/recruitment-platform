# Production compose file.
#
# Key differences from the dev docker-compose.yml:
# - No bind-mounts of ./app into the container — code is baked into the
#   image at build time (COPY in Dockerfile.prod), so a production
#   container can't be casually edited from the host and always runs
#   exactly what was built and tagged.
# - No --reload, no live-reload watcher — pure overhead in production,
#   and a source of subtle bugs if a file change ever triggered an
#   unwanted mid-request restart.
# - db / redis / chroma / minio no longer publish ports to the host at
#   all. In dev we needed 5435/6379/8001/9000 reachable from Windows for
#   pytest and manual debugging; in production nothing outside the
#   Docker network should ever reach these directly. Only nginx is
#   internet-facing.
# - Secrets come from .env.prod, which is NOT committed to git (see
#   .gitignore) and must be created on the deployment host directly —
#   see DEPLOYMENT.md for the full list of required variables.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: recruitment_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: recruitment_redis_prod
    restart: always
    # --appendonly yes: persists Redis's data to disk. In dev this
    # doesn't matter (cache is disposable), but losing the rate-limit
    # counters / cache state on every restart in production is a worse
    # tradeoff than the small persistence overhead.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  chroma:
    image: chromadb/chroma:0.5.20
    container_name: recruitment_chroma_prod
    restart: always
    volumes:
      - chroma_data:/chroma/chroma
    mem_limit: 2g
    cpus: 1.0

  minio:
    image: minio/minio:latest
    container_name: recruitment_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 0.5

  minio_init:
    image: minio/mc:latest
    container_name: recruitment_minio_init_prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME}
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: recruitment-platform-app:prod
    container_name: recruitment_app_prod
    restart: always
    environment:
      ENVIRONMENT: production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      chroma:
        condition: service_started
    # No "ports:" mapping here on purpose — nginx is the only service
    # that talks to the outside world. app is reachable from nginx via
    # the internal Docker network at app:8000, exactly like db/redis/
    # chroma/minio are reachable from app.
    mem_limit: 2g
    cpus: 2.0

  nginx:
    image: nginx:1.27-alpine
    container_name: recruitment_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    mem_limit: 256m
    cpus: 0.5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  chroma_data:
